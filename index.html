<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F17036">
<title>TEAM-UP رحلة الألغاز</title>
<link rel="icon" type="image/png" href="assets/mark-orange.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/brand.css">
<script src="assets/config.js"></script>
<style>
  html, body { overflow-x: clip; }
  body { background: var(--white); min-height: 100vh; min-height: 100dvh; }
  body.mode-orange { background: var(--orange); }

  .app { max-width: 560px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }

  /* Header */
  .top { background: var(--orange); color: var(--white); padding: calc(18px + env(safe-area-inset-top)) 20px 52px; }
  .mode-orange .top { display: none; }
  .top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .top-logo { height: 26px; width: auto; }
  .team {
    display: flex; align-items: center; gap: 8px; min-width: 0;
    background: rgba(255, 255, 255, .16); border-radius: 999px; padding: 6px 6px 6px 14px;
    font-size: 14px; font-weight: 600;
  }
  .team-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 42vw; }
  .team-change {
    border: 0; background: var(--white); color: var(--black); border-radius: 999px;
    height: 32px; padding: 0 14px; font-size: 13px; font-weight: 700; flex: none;
  }
  .progress { margin-top: 22px; }
  .progress-text { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; opacity: .92; margin-bottom: 8px; }
  .progress-text b { font-size: 15px; font-weight: 700; direction: ltr; }
  .bar { height: 6px; border-radius: 99px; background: rgba(255, 255, 255, .28); overflow: hidden; }
  .bar span { display: block; height: 100%; width: 0; background: var(--white); border-radius: inherit; transition: width .6s var(--ease); }

  /* Sheet */
  .sheet {
    flex: 1; background: var(--white); margin-top: -28px; border-radius: 28px 28px 0 0;
    padding: 30px 20px 24px; position: relative;
  }
  .mode-orange .sheet { background: transparent; margin: 0; border-radius: 0; color: var(--white); display: flex; flex-direction: column; justify-content: center; padding-top: calc(32px + env(safe-area-inset-top)); padding-bottom: 24px; }

  .center { min-height: 50vh; display: grid; place-items: center; text-align: center; }
  .muted { color: var(--muted); }

  /* Station */
  .station-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 18px; }
  .station-num { font-size: 13px; font-weight: 700; letter-spacing: .02em; color: var(--muted); }
  .station-num b { color: var(--black); font-size: 15px; }
  .question { font-size: 24px; line-height: 1.6; font-weight: 700; color: var(--black); margin-bottom: 26px; white-space: pre-line; }
  .instr { font-size: 14px; color: var(--muted); margin: -12px 0 16px; }

  .opts { display: grid; gap: 12px; }
  .opt {
    display: flex; align-items: center; gap: 14px; width: 100%; min-height: 62px; padding: 12px 16px;
    background: var(--white); border: 1.5px solid var(--line); border-radius: var(--radius);
    font-size: 17px; font-weight: 600; text-align: start; color: var(--ink);
    transition: border-color .15s, background .15s, color .15s, transform .12s var(--ease);
  }
  .opt > span:not(.badge) { min-width: 0; overflow-wrap: anywhere; }
  .question, .hint, .mission p, .state h2, .state p, .next-card, .hero h1, .hero p { overflow-wrap: anywhere; }
  .opt:hover:not(:disabled) { border-color: var(--black); }
  .opt:active:not(:disabled) { transform: scale(.985); }
  .opt:disabled { cursor: default; }
  .opt .badge {
    flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
    background: var(--bg); color: var(--ink-2); font-size: 15px; font-weight: 700; transition: inherit;
  }
  .opt.pending { border-color: var(--black); }
  .opt.correct { background: var(--green); border-color: var(--green); color: var(--white); }
  .opt.correct .badge { background: rgba(255, 255, 255, .2); color: var(--white); }
  .opt.wrong { background: var(--red-soft); border-color: var(--red); color: var(--red); }
  .opt.wrong .badge { background: var(--red); color: var(--white); }

  .tf { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tf .opt { flex-direction: column; justify-content: center; min-height: 120px; font-size: 19px; gap: 10px; }
  .tf .opt svg { width: 30px; height: 30px; }

  /* Ordering */
  .order-item .badge { border: 1.5px dashed var(--line-strong); background: transparent; }
  .order-item.ranked { border-color: var(--black); }
  .order-item.ranked .badge { border: 0; background: var(--black); color: var(--white); }
  .row-actions { display: flex; gap: 10px; margin-top: 18px; }
  .row-actions .btn-ghost { flex: none; }
  .row-actions .btn:not(.btn-ghost) { flex: 1; }

  /* PIN */
  .pin { position: relative; display: block; direction: ltr; margin: 4px 0 18px; }
  .pin input {
    position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: 0;
    font-size: 16px; caret-color: transparent;
  }
  .pin-boxes { display: flex; justify-content: center; gap: 10px; }
  .pin-box {
    width: 52px; height: 64px; border: 1.5px solid var(--line-strong); border-radius: 12px;
    display: grid; place-items: center; font-size: 26px; font-weight: 700; color: var(--black);
    transition: border-color .15s, box-shadow .15s;
  }
  .pin-boxes.many { gap: 6px; }
  .pin-boxes.many .pin-box { flex: 1 1 0; width: auto; min-width: 0; max-width: 44px; height: 54px; font-size: 22px; }
  .pin input:focus + .pin-boxes .pin-box.active { border-color: var(--black); box-shadow: 0 0 0 3px rgba(17, 17, 17, .08); }
  .pin-box.filled { border-color: var(--black); }
  .pin.error .pin-box { border-color: var(--red); color: var(--red); }
  .code-input { text-align: center; font-size: 22px; font-weight: 700; letter-spacing: .2em; direction: ltr; height: 60px; margin-bottom: 14px; }

  /* Mission */
  .mission {
    display: flex; gap: 14px; align-items: flex-start; padding: 16px; margin-bottom: 18px;
    background: var(--bg); border-radius: var(--radius);
  }
  .mission svg { flex: none; width: 26px; height: 26px; color: var(--orange); }
  .mission p { font-size: 15px; color: var(--ink-2); }
  .mission b { display: block; color: var(--black); font-size: 16px; margin-bottom: 2px; }
  .photo-box { margin-bottom: 16px; }
  .photo-pick {
    width: 100%; min-height: 168px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    border: 2px dashed var(--line-strong); border-radius: var(--radius); background: var(--white); color: var(--ink);
  }
  .photo-pick:hover:not(:disabled) { border-color: var(--black); }
  .photo-pick svg { width: 40px; height: 40px; color: var(--orange); margin-bottom: 4px; }
  .photo-pick b { font-size: 17px; }
  .photo-pick span { font-size: 14px; color: var(--muted); }
  .photo-preview { display: grid; gap: 10px; justify-items: center; }
  .photo-preview img { width: 100%; max-height: 52vh; object-fit: contain; border-radius: var(--radius); background: var(--bg); }
  .field-label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: var(--ink-2); }

  .feedback { min-height: 26px; margin-top: 16px; text-align: center; font-weight: 700; font-size: 16px; }
  .feedback.bad { color: var(--red); }
  .hint {
    display: flex; gap: 12px; margin-top: 14px; padding: 14px 16px; border-radius: var(--radius);
    background: var(--amber-soft); color: #6b4a12; font-size: 15px;
  }
  .hint svg { flex: none; width: 22px; height: 22px; color: var(--amber); margin-top: 1px; }
  .hint b { display: block; color: #4d340b; }

  /* Result states */
  .state { text-align: center; padding: 18px 0 8px; }
  .state-icon { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 20px; }
  .state-icon svg { width: 38px; height: 38px; }
  .state-icon.ok { background: var(--green); color: var(--white); }
  .state-icon.neutral { background: var(--bg); color: var(--ink-2); }
  .state h2 { font-size: 26px; font-weight: 700; color: var(--black); margin-bottom: 8px; }
  .state p { color: var(--muted); font-size: 16px; }
  .scan-btn { margin-top: 28px; gap: 10px; }
  .scan-btn svg { width: 22px; height: 22px; }
  .scan-note { margin-top: 12px; text-align: center; color: var(--muted); font-size: 14px; }
  .home .scan-btn { margin-top: 26px; }

  /* In-page QR scanner */
  .scanner { position: fixed; inset: 0; z-index: 3000; background: #000; color: var(--white); overflow: hidden; }
  .scanner video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .scan-frame {
    position: absolute; top: 46%; left: 50%; width: min(68vw, 62vh, 300px); aspect-ratio: 1;
    transform: translate(-50%, -50%); border-radius: 24px; box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .55);
  }
  .scan-frame i { position: absolute; width: 38px; height: 38px; border: 5px solid var(--orange); }
  .scan-frame i:nth-child(1) { top: -2px; left: -2px; border-right: 0; border-bottom: 0; border-top-left-radius: 24px; }
  .scan-frame i:nth-child(2) { top: -2px; right: -2px; border-left: 0; border-bottom: 0; border-top-right-radius: 24px; }
  .scan-frame i:nth-child(3) { bottom: -2px; left: -2px; border-right: 0; border-top: 0; border-bottom-left-radius: 24px; }
  .scan-frame i:nth-child(4) { bottom: -2px; right: -2px; border-left: 0; border-top: 0; border-bottom-right-radius: 24px; }
  .scan-line { position: absolute; left: 10%; right: 10%; height: 2px; background: var(--orange); box-shadow: 0 0 12px var(--orange); animation: scanline 2.2s ease-in-out infinite; }
  @keyframes scanline { 0%, 100% { top: 12%; } 50% { top: 88%; } }
  .scan-top {
    position: absolute; top: 0; left: 0; right: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between;
    padding: calc(14px + env(safe-area-inset-top)) 16px 14px; background: linear-gradient(rgba(0, 0, 0, .6), transparent);
  }
  .scan-top img { height: 22px; width: auto; }
  .scan-close { height: 40px; padding: 0 18px; border-radius: 999px; border: 0; background: var(--white); color: var(--black); font-weight: 700; font-size: 15px; }
  .scan-hint {
    position: absolute; left: 16px; right: 16px; bottom: calc(36px + env(safe-area-inset-bottom)); z-index: 2;
    text-align: center; font-size: 17px; font-weight: 600; text-shadow: 0 1px 6px rgba(0, 0, 0, .6);
  }
  .scan-hint.warn { color: #FFD3C2; }
  .scan-error { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; z-index: 1; }
  .scan-error > div { background: var(--white); color: var(--ink); border-radius: var(--radius-lg); padding: 24px; max-width: 360px; text-align: center; }
  .scan-error h3 { font-size: 19px; margin-bottom: 8px; }
  .scan-error p { color: var(--muted); font-size: 15px; margin-bottom: 18px; }

  .next-card {
    margin-top: 26px; padding: 16px; border: 1px solid var(--line); border-radius: var(--radius);
    display: flex; align-items: center; gap: 14px; text-align: start;
  }
  .next-card svg { flex: none; width: 28px; height: 28px; color: var(--orange); }
  .next-card b { display: block; font-size: 16px; }
  .next-card span { color: var(--muted); font-size: 14px; }

  /* Home */
  .eyebrow { font-size: 14px; font-weight: 600; color: var(--orange-strong); margin-bottom: 4px; }
  .home h1 { font-size: 28px; font-weight: 700; color: var(--black); line-height: 1.35; overflow-wrap: anywhere; }
  .home .lead { color: var(--muted); margin-top: 6px; font-size: 16px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 26px 0; }
  .cell {
    aspect-ratio: 1; border-radius: 12px; display: grid; place-items: center;
    font-weight: 700; font-size: 16px; background: var(--bg); color: var(--muted);
  }
  .cell.done { background: var(--black); color: var(--white); }
  .legend { display: flex; gap: 18px; font-size: 13px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 6px; vertical-align: middle; }

  /* Orange full screens: register + finished */
  .hero { text-align: center; padding: 0 4px; }
  .hero-logo { width: min(260px, 70%); margin: 0 auto 34px; }
  .hero h1 { font-size: 30px; font-weight: 700; line-height: 1.35; margin-bottom: 10px; }
  .hero p { font-size: 17px; opacity: .92; }
  .reg-card { margin-top: 30px; background: var(--white); color: var(--ink); border-radius: var(--radius-lg); padding: 22px; text-align: start; box-shadow: var(--shadow-lg); }
  .reg-card .input { height: 56px; font-size: 18px; margin-bottom: 12px; }
  .reg-note { margin-top: 12px; font-size: 13px; color: var(--muted); text-align: center; }
  .finish-badge { width: 96px; height: 96px; border-radius: 50%; background: var(--white); color: var(--orange); display: grid; place-items: center; margin: 0 auto 26px; }
  .finish-badge svg { width: 48px; height: 48px; }
  .finish-stats { display: inline-flex; flex-wrap: wrap; justify-content: center; gap: 4px 8px; max-width: 100%; margin-top: 26px; background: rgba(0, 0, 0, .14); padding: 10px 18px; border-radius: 22px; font-weight: 600; overflow-wrap: anywhere; }
  .finish-stats span:last-child { white-space: nowrap; }

  /* Report */
  .foot {
    display: flex; justify-content: center; background: var(--white);
    padding: 8px 16px calc(20px + env(safe-area-inset-bottom));
  }
  .mode-orange .foot { background: none; }
  .report {
    display: inline-flex; align-items: center; gap: 8px;
    height: 42px; padding: 0 18px; border-radius: 999px;
    background: var(--white); border: 1px solid var(--line-strong); color: var(--ink-2);
    font-size: 14px; font-weight: 600; box-shadow: var(--shadow-sm);
  }
  .report svg { width: 16px; height: 16px; color: var(--red); }

  /* Short screens (landscape) */
  @media (max-height: 520px) {
    .hero-logo { width: 170px; margin-bottom: 18px; }
    .reg-card { margin-top: 18px; }
  }

  .confetti { position: fixed; top: -12px; width: 9px; height: 14px; border-radius: 2px; z-index: 1200; pointer-events: none; }
  @keyframes fall { to { transform: translate3d(var(--dx), 108vh, 0) rotate(var(--rot)); opacity: .3; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-row">
      <img class="top-logo" src="assets/logo-white.png" alt="TEAM-UP">
      <div class="team" id="teamBox" hidden>
        <span class="team-name" id="teamName"></span>
        <button class="team-change" id="changeTeam" type="button">تغيير</button>
      </div>
    </div>
    <div class="progress" id="progressBox" hidden>
      <div class="progress-text"><span>تقدم الفريق</span><b id="progressText"></b></div>
      <div class="bar"><span id="progressBar"></span></div>
    </div>
  </header>

  <main class="sheet" id="view" aria-live="polite">
    <div class="center"><div class="spinner"></div></div>
  </main>

  <div class="foot" id="foot" hidden>
    <button class="report" id="reportBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22V4a1 1 0 0 1 .4-.8C5.6 2.4 7 2 9 2c3 0 4 2 7 2 1.5 0 2.7-.3 3.6-.8V15c-.9.5-2.1.8-3.6.8-3 0-4-2-7-2-2 0-3.4.4-5 1.2"/></svg>
      الإبلاغ عن مشكلة
    </button>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script type="module">
import { rpc, UUID_RE } from './assets/api.js';

const LS_KEY = 'teamup.team.v2';
const LEGACY_NAME_KEY = 'tuTeamName_ev2';
const LETTERS = ['أ', 'ب', 'ج', 'د', 'ه', 'و', 'ز', 'ح'];

const ICON = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  bulb: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M15.1 14c.2-1 .7-1.7 1.4-2.5A5.9 5.9 0 0 0 18 7.5 6 6 0 0 0 6 7.5c0 1.5.5 2.9 1.5 4 .7.8 1.2 1.5 1.4 2.5"/></svg>',
  camera: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>',
  scan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10"/></svg>',
  lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  trophy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.7V17c0 .6-.5 1-1 1.2C7.9 18.8 7 20.2 7 22M14 14.7V17c0 .6.5 1 1 1.2 1.1.6 2 2 2 3.8M18 2H6v7a6 6 0 0 0 12 0V2z"/></svg>',
  wifi: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01M8.5 16.4a5 5 0 0 1 7 0M5 12.9a10 10 0 0 1 14 0M1.4 9.4a15 15 0 0 1 21.2 0"/></svg>',
};

const view = document.getElementById('view');
let team = loadTeam();
let settings = {};
let navToken = 0;

// ─── helpers ───
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function loadTeam() {
  try {
    const t = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    return t && UUID_RE.test(t.id) ? t : null;
  } catch { return null; }
}
function saveTeam(t) {
  team = t;
  try { t ? localStorage.setItem(LS_KEY, JSON.stringify(t)) : localStorage.removeItem(LS_KEY); } catch {}
}
function stationFromHash() {
  const h = decodeURIComponent(location.hash.replace(/^#/, ''));
  return h && h !== 'finished' && h !== 'default' ? h : null;
}
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 3200);
}
function setMode(mode) {
  document.body.classList.toggle('mode-orange', mode === 'orange');
  document.querySelector('meta[name=theme-color]').content = '#F17036';
}
function setHeader({ progress } = {}) {
  document.getElementById('teamBox').hidden = !team;
  document.getElementById('teamName').textContent = team ? 'فريق ' + team.name : '';
  const box = document.getElementById('progressBox');
  box.hidden = !progress;
  if (progress) {
    document.getElementById('progressText').textContent = `${progress.solved} / ${progress.total}`;
    const pct = progress.total ? Math.round(progress.solved / progress.total * 100) : 0;
    requestAnimationFrame(() => { document.getElementById('progressBar').style.width = pct + '%'; });
  }
  document.getElementById('foot').hidden = false;
}
function render(html) { view.innerHTML = html; view.firstElementChild?.classList.add('rise'); }

function playSound(correct) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination); o.type = 'sine';
    if (correct) { o.frequency.setValueAtTime(880, ctx.currentTime); o.frequency.setValueAtTime(1320, ctx.currentTime + .12); }
    else o.frequency.setValueAtTime(220, ctx.currentTime);
    g.gain.setValueAtTime(.15, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + .35);
    o.start(); o.stop(ctx.currentTime + .35);
  } catch {}
}
function confetti() {
  const colors = ['#F17036', '#111111', '#FFFFFF', '#FEEBDA', '#F17036'];
  for (let i = 0; i < 34; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[i % colors.length];
    if (colors[i % colors.length] === '#FFFFFF') c.style.boxShadow = '0 0 0 1px rgba(0,0,0,.08)';
    c.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px');
    c.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
    c.style.animation = `fall ${1.5 + Math.random() * 1.3}s cubic-bezier(.3,.6,.4,1) ${Math.random() * .25}s forwards`;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3400);
  }
}

// ─── routing ───
async function route() {
  const token = ++navToken;
  if (!team) return renderRegister();
  const stationId = stationFromHash();
  if (stationId) return loadStation(stationId, token);
  return loadHome(token);
}

function renderError(retry) {
  setMode('white');
  render(`<div class="state">
    <div class="state-icon neutral">${ICON.wifi}</div>
    <h2>تعذر الاتصال</h2>
    <p>تأكدوا من اتصال الإنترنت ثم حاولوا مرة أخرى.</p>
    <button class="btn btn-lg btn-block" id="retry" style="margin-top:26px">إعادة المحاولة</button>
  </div>`);
  document.getElementById('retry').onclick = retry;
}
function renderLoading() {
  view.innerHTML = '<div class="center"><div class="spinner"></div></div>';
}
function handleNoTeam() {
  saveTeam(null);
  toast('يرجى تسجيل اسم الفريق من جديد');
  renderRegister();
}

// ─── registration ───
function renderRegister() {
  setMode('orange');
  document.getElementById('foot').hidden = false;
  let legacy = '';
  try { legacy = localStorage.getItem(LEGACY_NAME_KEY) || ''; } catch {}
  render(`<div class="hero">
    <img class="hero-logo" src="assets/logo-white.png" alt="TEAM-UP">
    <h1>${esc(settings.event_title || 'رحلة الألغاز')}</h1>

    <form class="reg-card" id="regForm" autocomplete="off">
      <label class="field-label" for="teamInput">اسم الفريق</label>

      <button class="btn btn-lg btn-block" id="regBtn" type="submit">ابدأ الرحلة</button>
      <p class="reg-note">إذا سجّل أحد أعضاء فريقكم بنفس الاسم، ستنضمون إلى نفس الفريق.</p>
    </form>
  </div>`);
  const form = document.getElementById('regForm');
  form.onsubmit = async (e) => {
    e.preventDefault();
    const input = document.getElementById('teamInput');
    const name = input.value.trim();
    if (!name) { input.focus(); return; }
    const btn = document.getElementById('regBtn');
    btn.disabled = true; btn.textContent = 'جارٍ التسجيل...';
    try {
      const res = await rpc('register_team', name);
      if (res.error) throw new Error(res.error);
      saveTeam({ id: res.id, name: res.name });
      if (res.joined) toast(`تم الانضمام إلى فريق ${res.name}`);
      route();
    } catch {
      btn.disabled = false; btn.textContent = 'ابدأ الرحلة';
      toast('تعذر التسجيل، حاولوا مرة أخرى');
    }
  };
}

// ─── home ───
async function loadHome(token) {
  renderLoading();
  let data;
  try { data = await rpc('get_team', team.id); } catch { return renderError(route); }
  if (token !== navToken) return;
  if (data.error === 'no_team') return handleNoTeam();
  saveTeam({ id: data.team.id, name: data.team.name });
  if (data.finished) return renderFinished(data);
  setMode('white');
  setHeader({ progress: data });
  render(`<div class="home">
    <p class="eyebrow">أهلاً بكم</p>

      `<div class="cell ${s.solved ? 'done' : ''}" title="المحطة ${s.position}">${s.solved ? ICON.check.replace('<svg', '<svg width="20" height="20"') : s.position}</div>`).join('')}</div>
    <div class="legend"><span><i style="background:var(--black)"></i>مكتملة</span><span><i style="background:var(--bg);border:1px solid var(--line)"></i>متبقية</span></div>

// ─── station ───
async function loadStation(stationId, token) {
  renderLoading();
  let data;
  try { data = await rpc('get_station', team.id, stationId); } catch { return renderError(route); }
  if (token !== navToken) return;
  if (data.error === 'no_team') return handleNoTeam();

  setMode('white');
  if (data.error === 'no_station' || data.error === 'closed') {
    setHeader();
    return render(`<div class="state">
      <div class="state-icon neutral">${data.error === 'closed' ? ICON.lock : ICON.scan}</div>
      <h2>${data.error === 'closed' ? 'هذه المحطة مغلقة حاليًا' : 'كود غير معروف'}</h2>
      <p>${data.error === 'closed' ? 'تواصلوا مع أحد المنظمين أو انتقلوا لمحطة أخرى.' : 'امسحوا كود المحطة مرة أخرى.'}</p>
      ${scanButton()}
    </div>`), wireScanButton();
  }

  saveTeam({ id: data.team.id, name: data.team.name });
  const progress = { solved: data.solved_count, total: data.total };
  setHeader({ progress });
  if (data.solved) return renderSolved(data.station, progress, true);
  renderQuestion(data);
}

      `<button class="opt" type="button" data-v="${i}"><span class="badge">${LETTERS[i] || i + 1}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
  } else if (st.type === 'truefalse') {

      <button class="opt" type="button" data-v="false">${ICON.x}<span>خطأ</span></button>

  } else if (st.type === 'order') {

      <div class="photo-box" id="photoBox">
        <button class="photo-pick" type="button" id="photoPick">
          ${ICON.camera}<b>التقطوا صورة</b><span>أو اختاروا صورة من الهاتف</span>
        </button>
        <div class="photo-preview" id="photoPreview" hidden>
          <img alt="الصورة المختارة">
          <button class="btn btn-ghost btn-sm" type="button" id="photoChange">تغيير الصورة</button>
        </div>
      </div>
      ${st.needs_code
        ? `<label class="field-label" for="codeInput">رمز المنظم</label>
           <input class="input code-input" id="codeInput" ${st.pin_numeric ? 'inputmode="numeric"' : ''} autocomplete="off" placeholder="••••">`
        : ''}
      <button class="btn btn-lg btn-block" type="button" id="missionBtn" disabled>إرسال الصورة</button>`;
  } else if (st.type === 'mission') {
    body = `<div class="mission">${ICON.camera}<p><b>مهمة جماعية</b>أكملوا المهمة وأروا المنظم النتيجة.</p></div>
      ${st.needs_code
        ? `<label class="field-label" for="codeInput">رمز المنظم</label>
           <input class="input code-input" id="codeInput" ${st.pin_numeric ? 'inputmode="numeric"' : ''} autocomplete="off" placeholder="••••">
           <button class="btn btn-lg btn-block" type="button" id="missionBtn">تأكيد إتمام المهمة</button>`
        : `<button class="btn btn-lg btn-block" type="button" id="missionBtn">المنظم: تأكيد إتمام المهمة</button>`}`;

function hintHtml(hint) {
  return hint ? `<div class="hint rise">${ICON.bulb}<div><b>تلميح</b>${esc(hint)}</div></div>` : '';
}

function wireQuestion(st) {
  const feedback = document.getElementById('feedback');
  const token = navToken;   // ignore results that arrive after the team moved to another screen

  async function submit(answer, { onWrong, onError } = {}) {
    feedback.textContent = ''; feedback.className = 'feedback';
    let res;
    try { res = await rpc('submit_answer', team.id, st.id, answer); }
    catch { if (token === navToken) { toast('تعذر الاتصال، حاولوا مرة أخرى'); onError?.(); } return null; }
    if (token !== navToken) return null;
    if (res.error === 'no_team') { handleNoTeam(); return null; }
    if (res.error) { route(); return null; }
    playSound(res.correct);
    const progress = { solved: res.solved_count, total: res.total };
    if (res.correct) {
      setHeader({ progress });
      confetti();
      setTimeout(() => {
        if (token !== navToken) return;
        if (res.finished) loadHome(++navToken);
        else renderSolved(st, progress, false);
      }, 650);
    } else {
      feedback.textContent = 'إجابة غير صحيحة، حاولوا مرة أخرى';
      feedback.className = 'feedback bad';
      if (res.hint && !document.querySelector('#hintSlot .hint')) document.getElementById('hintSlot').innerHTML = hintHtml(res.hint);
      onWrong?.();
    }
    return res;
  }

  // Multiple choice / true-false: tapping an option submits it.
  if (st.type === 'mcq' || st.type === 'truefalse') {
    const buttons = [...view.querySelectorAll('.opt')];
    buttons.forEach(btn => btn.onclick = async () => {
      buttons.forEach(b => b.disabled = true);
      btn.classList.add('pending');
      const v = btn.dataset.v;
      const answer = st.type === 'mcq' ? Number(v) : v === 'true';
      const res = await submit(answer, {
        onError: () => { btn.classList.remove('pending'); buttons.forEach(b => b.disabled = false); },
        onWrong: () => {
          btn.classList.remove('pending'); btn.classList.add('wrong', 'shake');
          setTimeout(() => {
            buttons.forEach(b => { b.disabled = false; b.classList.remove('wrong', 'shake'); });
          }, 1200);
        },
      });
      if (res?.correct) { btn.classList.remove('pending'); btn.classList.add('correct'); }
    });
  }

  // Ordering: tap items in order; tapping a ranked item removes it (and everything after it).
  if (st.type === 'order') {
    const items = [...view.querySelectorAll('.order-item')];
    const submitBtn = document.getElementById('orderSubmit');
    let order = [];
    const paint = () => {
      items.forEach(el => {
        const r = order.indexOf(Number(el.dataset.i));
        el.classList.toggle('ranked', r !== -1);
        el.querySelector('.badge').textContent = r === -1 ? '' : r + 1;
      });
      submitBtn.disabled = order.length !== items.length;
    };
    items.forEach(el => el.onclick = () => {
      const i = Number(el.dataset.i);
      const r = order.indexOf(i);
      order = r === -1 ? [...order, i] : order.slice(0, r);
      feedback.textContent = '';
      paint();
    });
    document.getElementById('orderReset').onclick = () => { order = []; paint(); };
    submitBtn.onclick = async () => {
      submitBtn.disabled = true;
      const list = document.getElementById('orderList');
      await submit(order.map(i => st.options[i]), {
        onWrong: () => { list.classList.add('shake'); setTimeout(() => list.classList.remove('shake'), 500); paint(); },
        onError: paint,
      });
    };
  }

  // PIN code
  if (st.type === 'pin') {
    const input = document.getElementById('pinInput');
    const pin = document.getElementById('pin');
    const boxes = [...view.querySelectorAll('.pin-box')];
    const submitBtn = document.getElementById('pinSubmit');
    const n = boxes.length;
    const paint = () => {
      const v = input.value;
      boxes.forEach((b, i) => {
        b.textContent = v[i] || '';
        b.classList.toggle('filled', i < v.length);
        b.classList.toggle('active', i === Math.min(v.length, n - 1));
      });
      submitBtn.disabled = v.length !== n;
    };
    input.oninput = () => {
      if (st.pin_numeric) input.value = input.value.replace(/[٠-٩۰-۹]/g, d => '٠١٢٣٤٥٦٧٨٩۰۱۲۳۴۵۶۷۸۹'.indexOf(d) % 10).replace(/\D/g, '');
      input.value = input.value.slice(0, n);
      pin.classList.remove('error'); feedback.textContent = '';
      paint();
    };
    input.onkeydown = (e) => { if (e.key === 'Enter' && !submitBtn.disabled) submitBtn.click(); };
    submitBtn.onclick = async () => {
      submitBtn.disabled = true;
      await submit(input.value, {
        onWrong: () => {
          pin.classList.add('error', 'shake');
          setTimeout(() => { pin.classList.remove('shake'); input.value = ''; paint(); input.focus(); }, 700);
        },
        onError: paint,
      });
    };
    paint();
    setTimeout(() => input.focus(), 300);
  }

  // Photo mission (optionally protected by an organizer code)
  if (st.type === 'mission') {
    const btn = document.getElementById('missionBtn');
    const code = document.getElementById('codeInput');
    const wrongCode = () => {
      btn.disabled = false;
      code?.classList.add('shake'); setTimeout(() => code?.classList.remove('shake'), 500);
      if (code) { code.value = ''; code.focus(); }
      feedback.textContent = 'رمز المنظم غير صحيح'; feedback.className = 'feedback bad';
    };

    if (!st.photo_required) {
      btn.onclick = async () => {
        if (code && !code.value.trim()) { code.focus(); return; }
        btn.disabled = true;
        await submit(code ? code.value : null, { onWrong: wrongCode, onError: () => { btn.disabled = false; } });
      };
      return;
    }

    // photo required: pick/take a photo, preview it, upload it, then complete the station
    const input = document.getElementById('photoInput');
    const pick = document.getElementById('photoPick');
    const preview = document.getElementById('photoPreview');
    let photo = null;        // { image, thumb } base64 JPEGs
    let uploaded = false;
    pick.onclick = () => input.click();
    document.getElementById('photoChange').onclick = () => input.click();
    input.onchange = async () => {
      const file = input.files?.[0];
      input.value = '';
      if (!file) return;
      pick.disabled = true;
      try {
        photo = await preparePhoto(file);
        uploaded = false;
        preview.querySelector('img').src = 'data:image/jpeg;base64,' + photo.image;
        preview.hidden = false; pick.hidden = true;
        btn.disabled = false;
        feedback.textContent = '';
      } catch {
        toast('تعذر قراءة الصورة، جربوا صورة أخرى');
      } finally { pick.disabled = false; }
    };

    btn.onclick = async () => {
      if (!photo) { input.click(); return; }
      if (code && !code.value.trim()) { code.focus(); return; }
      btn.disabled = true;
      const label = btn.textContent;
      if (!uploaded) {
        btn.textContent = 'جارٍ رفع الصورة...';
        let res;
        try { res = await rpc('upload_photo', team.id, st.id, photo); }
        catch { btn.disabled = false; btn.textContent = label; toast('تعذر رفع الصورة، تأكدوا من الاتصال وحاولوا مرة أخرى'); return; }
        if (token !== navToken) return;
        if (res.error === 'no_team') return handleNoTeam();
        if (res.error === 'closed' || res.error === 'no_station') return route();
        if (res.error) { btn.disabled = false; btn.textContent = label; toast('تعذر رفع الصورة، جربوا صورة أخرى'); return; }
        uploaded = true;
      }
      btn.textContent = label;
      await submit(code ? code.value : null, { onWrong: wrongCode, onError: () => { btn.disabled = false; } });
    };
  }
}

// Resize a photo on the phone before upload: ~1280px JPEG + small thumbnail for the admin gallery.
async function preparePhoto(file) {
  const src = await loadImage(file);
  const draw = (max, quality) => {
    const w = src.width, h = src.height;
    const scale = Math.min(1, max / Math.max(w, h));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w * scale));
    c.height = Math.max(1, Math.round(h * scale));
    c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', quality).split(',')[1];
  };
  let image = draw(1280, 0.82);
  if (image.length > 850000) image = draw(1024, 0.7);
  if (image.length > 850000) image = draw(800, 0.6);
  return { image, thumb: draw(360, 0.7) };
}
function loadImage(file) {
  if (window.createImageBitmap) {
    return createImageBitmap(file, { imageOrientation: 'from-image' }).catch(() => loadImageEl(file));
  }
  return loadImageEl(file);
}
function loadImageEl(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('decode')); };
    img.src = url;
  });
}

// ─── in-page QR scanner ───
function scanButton(note) {
  return `<button class="btn btn-lg btn-block scan-btn" type="button" id="scanNext">${ICON.scan}<span>امسحوا كود المحطة التالية</span></button>
    ${note ? `<p class="scan-note">${note}</p>` : ''}`;
}
function wireScanButton() {
  const b = document.getElementById('scanNext');
  if (b) b.onclick = openScanner;
  loadJsQR().catch(() => {});   // warm up so the camera opens fast
}

let jsqrPromise = null;
function loadJsQR() {
  if (window.jsQR) return Promise.resolve();
  return jsqrPromise ||= new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'assets/vendor/jsQR.js';
    s.onload = resolve;
    s.onerror = () => { jsqrPromise = null; reject(new Error('jsQR failed to load')); };
    document.head.appendChild(s);
  });
}

let scanner = null;
async function openScanner() {
  if (scanner) return;
  const el = document.createElement('div');
  el.className = 'scanner';
  el.innerHTML = `
    <video playsinline muted autoplay></video>
    <div class="scan-frame"><i></i><i></i><i></i><i></i><div class="scan-line"></div></div>
    <div class="scan-top"><img src="assets/logo-white.png" alt="TEAM-UP"><button class="scan-close" type="button">إغلاق</button></div>
    <div class="scan-hint">وجّهوا الكاميرا نحو كود المحطة</div>`;
  document.body.appendChild(el);
  const video = el.querySelector('video');
  const hint = el.querySelector('.scan-hint');
  let stream = null, raf = 0, stopped = false;

  const onHide = () => { if (document.hidden) close(); };
  function close() {
    if (stopped) return;
    stopped = true;
    cancelAnimationFrame(raf);
    stream?.getTracks().forEach(t => t.stop());
    el.remove();
    scanner = null;
    window.removeEventListener('hashchange', close);
    document.removeEventListener('visibilitychange', onHide);
  }
  scanner = { close };
  el.querySelector('.scan-close').onclick = close;
  window.addEventListener('hashchange', close);
  document.addEventListener('visibilitychange', onHide);

  const fail = (title, text) => {
    if (stopped) return;
    hint.hidden = true;
    el.querySelector('.scan-frame').hidden = true;
    const box = document.createElement('div');
    box.className = 'scan-error';
    box.innerHTML = `<div><h3>${title}</h3><p>${text}</p><button class="btn btn-lg btn-block" type="button">حسنًا</button></div>`;
    box.querySelector('button').onclick = close;
    el.appendChild(box);
  };

  if (!navigator.mediaDevices?.getUserMedia) {
    return fail('الكاميرا غير متاحة', 'هذا المتصفح لا يدعم فتح الكاميرا. استخدموا كاميرا الهاتف لمسح الكود.');
  }
  try {
    const [s] = await Promise.all([
      navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false }),
      loadJsQR(),
    ]);
    stream = s;
    if (stopped) { s.getTracks().forEach(t => t.stop()); return; }
    video.srcObject = s;
    await video.play().catch(() => {});
  } catch (e) {
    if (e?.name === 'NotAllowedError' || e?.name === 'SecurityError') {
      return fail('لم يُسمح باستخدام الكاميرا', 'اسمحوا للموقع باستخدام الكاميرا من إعدادات المتصفح، أو استخدموا كاميرا الهاتف لمسح الكود.');
    }
    if (e?.name === 'NotFoundError' || e?.name === 'OverconstrainedError') {
      return fail('لم يتم العثور على كاميرا', 'استخدموا كاميرا الهاتف لمسح الكود.');
    }
    return fail('تعذر فتح الكاميرا', 'حاولوا مرة أخرى، أو استخدموا كاميرا الهاتف لمسح الكود.');
  }

  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  let last = 0;
  const tick = (t) => {
    if (stopped) return;
    raf = requestAnimationFrame(tick);
    if (t - last < 120 || video.readyState < 2 || !video.videoWidth) return;
    last = t;
    const scale = Math.min(1, 720 / Math.max(video.videoWidth, video.videoHeight));
    canvas.width = Math.round(video.videoWidth * scale);
    canvas.height = Math.round(video.videoHeight * scale);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = window.jsQR(img.data, img.width, img.height, { inversionAttempts: 'attemptBoth' });
    if (code?.data) onCode(code.data.trim());
  };
  raf = requestAnimationFrame(tick);

  function onCode(text) {
    const m = text.match(/(ev2-station\d+)/);
    if (m) {
      navigator.vibrate?.(60);
      close();
      if (location.hash === '#' + m[1]) route(); else location.hash = m[1];
      return;
    }
    let u = null;
    try { u = new URL(text); } catch {}
    if (u && /^https?:$/.test(u.protocol)) {
      navigator.vibrate?.(60);
      close();
      const here = new URL(location.href);
      const samePage = u.origin === here.origin &&
        u.pathname.replace(/index\.html$/, '') === here.pathname.replace(/index\.html$/, '');
      if (samePage) {
        // the registration / home code of this game
        if (location.hash) location.hash = ''; else route();
      } else {
        location.href = text;   // e.g. a short link that redirects to a station
      }
      return;
    }
    hint.textContent = 'هذا الكود لا يخص اللعبة — امسحوا كود المحطة';
    hint.classList.add('warn');
  }
}

// ─── global actions ───
document.getElementById('changeTeam').onclick = () => {
  if (!confirm('هل تريدون تسجيل اسم فريق آخر على هذا الجهاز؟')) return;
  saveTeam(null);
  renderRegister();
};

document.getElementById('reportBtn').onclick = async () => {
  if (!confirm('هل تحتاجون مساعدة؟ سيتم تنبيه المنظمين للحضور إليكم.')) return;
  try {
    await rpc('report_problem', team?.id || null, stationFromHash());
    toast('تم إرسال البلاغ، سيصل أحد المنظمين قريبًا');
  } catch {
    toast('تعذر إرسال البلاغ، حاولوا مرة أخرى');
  }
};

window.addEventListener('hashchange', route);

rpc('get_settings').then(s => {
  settings = s || {};
  const regTitle = document.querySelector('.hero h1');
  if (regTitle && document.getElementById('regForm')) regTitle.textContent = settings.event_title || regTitle.textContent;
}).catch(() => {});
route();
</script>
