<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TEAM-UP — لوحة الصدارة</title>
<link rel="icon" type="image/png" href="assets/mark-orange.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/brand.css">
<script src="assets/config.js"></script>
<style>
  body { background: var(--black); color: var(--white); min-height: 100vh; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: clamp(20px, 4vw, 48px) clamp(16px, 4vw, 48px) 64px; }

  .head { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: clamp(24px, 4vw, 44px); flex-wrap: wrap; }
  .head img { height: clamp(26px, 3.2vw, 40px); width: auto; }
  .head h1 { font-size: clamp(24px, 3.4vw, 44px); font-weight: 700; margin-top: 14px; }
  .head h1 span { color: var(--orange); }
  .meta { display: flex; align-items: center; gap: 10px; color: rgba(255, 255, 255, .6); font-size: clamp(13px, 1.2vw, 16px); }
  .meta i { width: 9px; height: 9px; border-radius: 50%; background: #3ccf7a; box-shadow: 0 0 0 4px rgba(60, 207, 122, .18); }
  .meta.off i { background: var(--red); box-shadow: 0 0 0 4px rgba(210, 59, 44, .2); }

  .list { display: grid; gap: 10px; }
  .row {
    display: grid; grid-template-columns: clamp(44px, 5vw, 72px) minmax(0, 1.2fr) minmax(0, 1fr) auto;
    align-items: center; gap: clamp(12px, 2vw, 28px);
    padding: clamp(14px, 1.6vw, 22px) clamp(16px, 2vw, 28px);
    background: #1B1B1B; border: 1px solid #262626; border-radius: 16px;
    transition: transform .4s var(--ease);
  }
  .row.first { background: var(--orange); border-color: var(--orange); }
  .pos { font-size: clamp(22px, 2.6vw, 36px); font-weight: 700; color: rgba(255, 255, 255, .45); font-variant-numeric: tabular-nums; }
  .row.top .pos { color: var(--orange); }
  .row.first .pos { color: var(--white); }
  .name { font-size: clamp(18px, 2.1vw, 30px); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { height: clamp(8px, .9vw, 12px); background: #2C2C2C; border-radius: 99px; overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--orange); border-radius: inherit; transition: width .8s var(--ease); }
  .row.first .bar { background: rgba(255, 255, 255, .3); }
  .row.first .bar span { background: var(--white); }
  .score { font-size: clamp(18px, 2vw, 28px); font-weight: 700; font-variant-numeric: tabular-nums; direction: ltr; text-align: left; min-width: 3.5em; }
  .score small { font-size: .6em; color: rgba(255, 255, 255, .5); font-weight: 600; }
  .row.first .score small { color: rgba(255, 255, 255, .8); }
  .done { display: inline-flex; align-items: center; gap: 6px; margin-inline-start: 10px; font-size: .55em; font-weight: 700; background: var(--white); color: var(--black); padding: 3px 10px; border-radius: 99px; vertical-align: middle; }

  .empty { text-align: center; padding: 80px 20px; color: rgba(255, 255, 255, .5); font-size: clamp(18px, 2vw, 26px); border: 1px dashed #333; border-radius: 20px; }

  @media (max-width: 640px) {
    .row { grid-template-columns: 40px minmax(0, 1fr) auto; }
    .row .bar { grid-column: 2 / -1; grid-row: 2; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <img src="assets/logo-white.png" alt="TEAM-UP">
      <h1><span>لوحة الصدارة</span> · <span id="eventTitle" style="color:inherit">رحلة الألغاز</span></h1>
    </div>
    <div class="meta" id="meta"><i></i><span id="updated">جارٍ التحميل...</span></div>
  </div>
  <div class="list" id="list"></div>
</div>

<script type="module">
import { rpc } from './assets/api.js';

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function refresh() {
  try {
    const data = await rpc('leaderboard');
    const list = document.getElementById('list');
    if (!data.teams.length) {
      list.innerHTML = '<div class="empty">في انتظار أول فريق يسجل...</div>';
    } else {
      list.innerHTML = data.teams.map((t, i) => {
        const pct = data.total ? Math.round(t.solved / data.total * 100) : 0;
        return `<div class="row ${i === 0 && t.solved > 0 ? 'first' : ''} ${i < 3 ? 'top' : ''}">
          <div class="pos">${i + 1}</div>
          <div class="name" dir="auto">${esc(t.name)}${t.finished_at ? '<span class="done">✓ أنهى</span>' : ''}</div>
          <div class="bar"><span style="width:${pct}%"></span></div>
          <div class="score">${t.solved}<small> / ${data.total}</small></div>
        </div>`;
      }).join('');
    }
    document.getElementById('meta').classList.remove('off');
    document.getElementById('updated').textContent = 'مباشر · آخر تحديث ' + new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  } catch {
    document.getElementById('meta').classList.add('off');
    document.getElementById('updated').textContent = 'تعذر التحديث — إعادة المحاولة تلقائيًا';
  }
}

rpc('get_settings').then(s => { if (s.event_title) document.getElementById('eventTitle').textContent = s.event_title; }).catch(() => {});
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
